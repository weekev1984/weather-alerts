name: Check Met Office warnings

on:
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours (UTC), a few minutes past to avoid the busy top of the hour
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      send_test:
        description: "Also send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write            # to save state.json back to the repo

concurrency:
  group: check-warnings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check for new warnings
        env:
          RUN_SUMMARY_FILE: ${{ runner.temp }}/run_summary.txt
          # Accept the topic as a secret or a variable, under either name.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.KEVS_WEATHER || vars.NTFY_TOPIC || vars.KEVS_WEATHER }}
          SEND_TEST: ${{ inputs.send_test && '1' || '' }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REGIONS: ${{ vars.REGIONS || 'UK' }}
          PRIORITY_REGIONS: ${{ vars.PRIORITY_REGIONS || 'os,he,gr,ta,st,se,sw' }}
        run: python check_warnings.py

      - name: Check for possible storms (preliminary alerts)
        if: always()
        continue-on-error: true    # never let the outlook break the real warnings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.KEVS_WEATHER || vars.NTFY_TOPIC || vars.KEVS_WEATHER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PRELIM_PROBABILITY: ${{ vars.PRELIM_PROBABILITY || '30' }}
          RUN_SUMMARY_FILE: ${{ runner.temp }}/run_summary.txt
        run: python storm_outlook.py

      # "Still running" ping after every run. Turn off by setting the repository
      # variable HEARTBEAT to off. Real warnings and storm alerts are unaffected.
      - name: Send heartbeat
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.KEVS_WEATHER || vars.NTFY_TOPIC || vars.KEVS_WEATHER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HEARTBEAT: ${{ vars.HEARTBEAT || 'on' }}
          RUN_SUMMARY_FILE: ${{ runner.temp }}/run_summary.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python heartbeat.py

      - name: Save seen warnings
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json storm_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json storm_state.json
            git commit -m "Update seen warnings"
            git push
          fi
